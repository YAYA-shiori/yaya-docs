# 左侧菜单的定义（相当于旧 AYAYA wiki 的 MenuBar）。这是网站层级结构的基础文件，
# 左侧菜单、顶部面包屑导航和各节的索引页都由此生成。
#
# 项目的写法（在 menu: 下排列。可通过 children: 嵌套子项目。深度不限）
#   - title: 显示的名称        必填
#     page: 原稿路径           站内页面。填写仓库内的路径（`startup/cheatsheet.md`）
#                                也可以像 `INDEX.md#标题` 一样用 # 添加锚点
#                                还可以填写合并后的原稿，例如 `functions/IHASH.md` 或 `grammar/05-arrays.md`
#     index: basic/              自动创建子项目的索引页。填写其 URL（小写字母、数字和连字符，末尾为 /）。
#                                该页面内容仅为列出 children: 和 list: 中的页面
#     url: https://...           外部页面
#     children: [...]            子项目。会显示在左侧菜单中，也会列在索引页中
#     list: tips                 将该目录下未列在 menu.yml 任何位置的原稿放在此项目下。
#                                不显示在左侧菜单中，仅用于索引页和面包屑导航（适用于 Tips 这类页面较多的目录）。
#                                排序规则：如果目录中有 .nav.yml，则按其中的顺序；其余页面按各自标题（H1）的顺序排列
#   page: index: url: 每个项目只能填写其中一项。若都不填写，该项目会成为没有链接的标题（不能在其下放置页面）。
#
# 原稿必须列在某处的 children: 或 list: 中（如果有原稿未列出，构建会停止）。
# 同一页面可以列在多个位置，但面包屑导航会将其归到首次出现的项目下。
# 如果原稿路径或锚点不正确，构建（oldstyle/build.py）也会停止。显示顺序与填写顺序一致。

site_name: YAYA マニュアル
site_description: 伺かの SHIORI「YAYA」の言語マニュアル
site_url: https://yaya-shiori.github.io/yaya-docs/
repo_url: https://github.com/YAYA-shiori/yaya-docs
repo_name: YAYA-shiori/yaya-docs
edit_uri: ""

# 原稿はリポジトリ直下にあるため、scripts/prepare_site.py で _site_src/ に写してからビルドする
docs_dir: _site_src
site_dir: _site

theme:
  name: material
  # Zensical の既定は modern（新デザイン）。従来の見た目は classic
  variant: classic
  # OGP などの <head> の追加（overrides/main.html）
  custom_dir: overrides
  language: ja
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

# ページごとの OGP（overrides/main.html が使う）。キーはページの URL（トップは ""）、image は site_url からの相対パス（1200x630）
extra:
  ogp:
    other/yaya6-launch/:
      title: YAYA 6 登場 ─ これまでで最も賢い YAYA。
      description: ハッシュ、入れ子、JSON / XML / YAML / TOML の読み書き、SQLite。YAYA 600 系、初の正式版 Tc603 の一般提供を開始しました。
      image: assets/yaya6/ogp.png

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang: ja
  - awesome-nav

markdown_extensions:
  - tables
  - admonition
  - attr_list
  # <div markdown> の中の Markdown を処理する（other/yaya6-launch.md の装飾用）
  - md_in_html
  - mdx_truly_sane_lists
  - pymdownx.superfences
  - toc:
      permalink: true
      # GitHub と同じく日本語の見出しをそのままアンカーにする
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    anchors: warn

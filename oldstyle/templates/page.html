<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta name="ukadoc-langs" content="$langs">
<link rel="icon" href="${root}${base}assets/logo.png">
<link rel="stylesheet" href="${root}style.css">
<script src="${root}menu.js"></script>
$head</head>
<body data-root="$root"$body_attr>
<header id="header">
<a id="site-logo" href="$home"><img src="${root}skin/title.png" width="220" height="80" alt="$l_site_name"></a>
<div id="header1">
<div id="site-title">
<p id="site-name"><a href="$home"><img src="${root}skin/logo.png" width="350" height="40" alt="AYAYA/04 YAYA Documentation"></a></p>
$breadcrumb</div>
<div id="search">
<form action="${root}search/" role="search">
<div class="search-field">
<input id="query" name="q" type="search" autocomplete="off" placeholder="$l_search_ph" title="$l_search_ph" aria-label="$l_search_ph" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-dropdown">
<span class="search-icon" aria-hidden="true">🔍</span>
</div>
</form>
</div>
</div>
</header>
<div id="page">
<nav id="menubar" aria-label="$l_contents">
<h5>Menu</h5>
$menu
</nav>
<main id="body">
$content
</main>
</div>
<script src="${root}search.js" defer></script>
<script src="${root}lang.js" defer></script>
</body>
</html>
